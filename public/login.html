<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BehaviorPulse Student Tracker</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between antialiased">

  <!-- Main Container -->
  <main class="flex-grow flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
      
      <!-- Brand Header -->
      <div class="bg-indigo-600 p-8 text-white text-center relative overflow-hidden">
        <div class="absolute -right-10 -top-10 w-40 h-40 bg-indigo-500 rounded-full opacity-30"></div>
        <div class="absolute -left-10 -bottom-10 w-32 h-32 bg-indigo-500 rounded-full opacity-30"></div>
        
        <div class="relative z-10">
          <div class="inline-flex items-center justify-center w-12 h-12 bg-white/10 rounded-xl mb-4">
            <!-- Pulsing heart or graph icon -->
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
          </div>
          <h1 class="text-3xl font-bold tracking-tight font-display">BehaviorPulse</h1>
          <p class="text-indigo-100 mt-2 text-sm">Gamified Student Behavior & Points Tracker</p>
        </div>
      </div>

      <!-- Login Form Content -->
      <div class="p-8">
        <!-- Error Alert Container -->
        <div id="error-banner" class="hidden mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-md">
          <div class="flex">
            <div class="flex-shrink-0">
              <svg class="h-5 w-5 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
              </svg>
            </div>
            <div class="ml-3">
              <p id="error-message" class="text-sm text-red-800 font-medium"></p>
            </div>
          </div>
        </div>

        <form id="login-form" class="space-y-6">
          <div>
            <label for="email" class="block text-sm font-semibold text-slate-700">School Email</label>
            <div class="mt-1 relative rounded-md shadow-sm">
              <input type="email" id="email" required placeholder="name@pulse.com" 
                class="block w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-slate-800 placeholder-slate-400">
            </div>
          </div>

          <div>
            <label for="password" class="block text-sm font-semibold text-slate-700">Password</label>
            <div class="mt-1 relative rounded-md shadow-sm">
              <input type="password" id="password" required placeholder="••••••••" 
                class="block w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-slate-800 placeholder-slate-400">
            </div>
          </div>

          <button type="submit" id="submit-btn" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all cursor-pointer">
            Sign In to Dashboard
          </button>
        </form>

        <!-- Quick Access / Sandbox Logins -->
        <div class="mt-8 pt-6 border-t border-slate-100">
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 text-center">Demo Sandbox Logins</p>
          <div class="grid grid-cols-2 gap-3">
            <button onclick="fillForm('teacher@pulse.com')" class="flex flex-col items-center justify-center p-3 border border-slate-100 hover:border-indigo-200 rounded-xl hover:bg-indigo-50/50 transition-all text-left">
              <span class="text-xs font-bold text-indigo-700 flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v12a2 2 0 01-2 2zM12 11l5 5H7l5-5z"></path></svg>
                Teacher Mode
              </span>
              <span class="text-[10px] text-slate-500 mt-1">Mr. Henderson</span>
            </button>
            <button onclick="fillForm('student1@pulse.com')" class="flex flex-col items-center justify-center p-3 border border-slate-100 hover:border-emerald-200 rounded-xl hover:bg-emerald-50/50 transition-all text-left">
              <span class="text-xs font-bold text-emerald-700 flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                Student/Parent
              </span>
              <span class="text-[10px] text-slate-500 mt-1">Alice Smith</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Humble Footer -->
  <footer class="py-6 text-center text-xs text-slate-400">
    <p>&copy; 2026 BehaviorPulse Performance Network. All rights secured.</p>
  </footer>

  <script src="/js/login.js"></script>
  <script>
    function fillForm(email) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = 'password123';
      
      // Flash input colors briefly to indicate fill
      const emailInput = document.getElementById('email');
      const passInput = document.getElementById('password');
      emailInput.classList.add('bg-indigo-50');
      passInput.classList.add('bg-indigo-50');
      setTimeout(() => {
        emailInput.classList.remove('bg-indigo-50');
        passInput.classList.remove('bg-indigo-50');
      }, 500);
    }
  </script>
</body>
</html>
