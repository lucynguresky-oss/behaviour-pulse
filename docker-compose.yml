services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=5174
      - MONGODB_URI=mongodb://db:27017/behaviorpulse
    depends_on:
      - db

  db:
    image: mongo:6.0
    container_name: behaviorpulse_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
